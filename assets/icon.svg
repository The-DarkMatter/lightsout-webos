<?xml version="1.0" encoding="UTF-8"?>
<!--
  Lights Out — webOS TV launcher icon ("Gantry over play")
  Five lit start lights on a hanging gantry, over a play button.
  Master artwork. Square, full bleed, opaque: webOS rounds the corners itself.
  Render to app/icon.png (80), app/largeIcon.png (130), assets/app-icon.png (512).
  Uses no Formula 1 trademarks, wordmarks or livery.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" width="360" height="360"
     role="img" aria-label="Lights Out">
  <title>Lights Out</title>

  <!-- Ground -->
  <rect width="360" height="360" fill="#15151E"/>

  <!-- Gantry: two posts running off the top edge, and the light bar -->
  <rect x="90" y="-10" width="16" height="70" rx="6" fill="#2C2C38"/>
  <rect x="254" y="-10" width="16" height="70" rx="6" fill="#2C2C38"/>
  <rect x="18" y="50" width="324" height="104" rx="26" fill="#2A2A36"/>

  <!-- Five start lights, each with a highlight -->
  <g fill="#FF2A1F">
    <circle cx="70" cy="102" r="27"/>
    <circle cx="125" cy="102" r="27"/>
    <circle cx="180" cy="102" r="27"/>
    <circle cx="235" cy="102" r="27"/>
    <circle cx="290" cy="102" r="27"/>
  </g>
  <g fill="#FFFFFF" fill-opacity="0.35">
    <circle cx="70" cy="94" r="9"/>
    <circle cx="125" cy="94" r="9"/>
    <circle cx="180" cy="94" r="9"/>
    <circle cx="235" cy="94" r="9"/>
    <circle cx="290" cy="94" r="9"/>
  </g>

  <!-- Play -->
  <path d="M 144 196 Q 144 182 156 189 L 256 247 Q 268 254 256 261 L 156 319 Q 144 326 144 312 Z" fill="#FFFFFF"/>
</svg>
