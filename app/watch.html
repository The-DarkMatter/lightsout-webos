<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Lights Out - watch (real F1TV content)</title>
    <script src="lib/webOSTVjs-1.2.4/webOSTV.js"></script>
    <script src="lib/shaka/shaka-player.compiled.js"></script>
    <style>
      /* Bundled Barlow faces (fonts/OFL.txt), as on Browse. */
      @font-face { font-family: "Barlow"; font-weight: 500; src: url(fonts/Barlow-500.woff2) format("woff2"); }
      @font-face { font-family: "Barlow"; font-weight: 600; src: url(fonts/Barlow-600.woff2) format("woff2"); }
      @font-face { font-family: "Barlow"; font-weight: 700; src: url(fonts/Barlow-700.woff2) format("woff2"); }
      @font-face { font-family: "Barlow Condensed"; font-weight: 500; src: url(fonts/BarlowCondensed-500.woff2) format("woff2"); }
      @font-face { font-family: "Barlow Condensed"; font-weight: 600; src: url(fonts/BarlowCondensed-600.woff2) format("woff2"); }
      @font-face { font-family: "Barlow Condensed"; font-weight: 700; src: url(fonts/BarlowCondensed-700.woff2) format("woff2"); }
      html, body {
        margin: 0; padding: 0; width: 1920px; height: 1080px;
        background: #0b0b0d; color: #f2f2f2; font-family: sans-serif; overflow: hidden;
      }
      #wrap { display: flex; height: 100%; }
      #left { width: 480px; flex: none; padding: 24px; overflow-y: auto; box-sizing: border-box; }
      #left.hidden-panel { display: none; }
      #left.hidden-panel ~ #right { flex: 1; }
      #right { flex: 1; position: relative; background: #000; }
      video { width: 100%; height: 100%; object-fit: contain; background: #000; }
      #left-header { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
      #left-header a { color: #888; font-size: 20px; text-decoration: none; }
      #left-header a:hover, #left-header a:focus { color: #e10600; }
      #left-header .brand { color: #e10600; font-size: 16px; font-weight: bold; }
      h1 { color: #f2f2f2; margin: 0 0 16px; font-size: 16px; opacity: 0.6; font-weight: normal; }
      label { font-size: 13px; opacity: 0.7; display: block; margin-top: 10px; }
      input {
        width: 100%; box-sizing: border-box; font-family: monospace; font-size: 14px;
        padding: 6px 8px; background: #16161a; color: #f2f2f2; border: 1px solid #2a2a30;
        border-radius: 6px; margin-top: 4px;
      }
      button {
        background: #e10600; color: #fff; border: none; padding: 8px 14px; border-radius: 6px;
        font-size: 14px; margin-top: 10px; cursor: pointer;
      }
      #status { margin-top: 12px; font-family: monospace; font-size: 13px; white-space: pre-wrap; }
      .ok { color: #3ddc84; } .fail { color: #ff5a5a; } .pending { color: #ffcc00; }
      #feeds { margin-top: 16px; }
      .feed-row {
        padding: 8px 10px; margin-bottom: 4px; background: #16161a; border: 1px solid #2a2a30;
        border-radius: 6px; cursor: pointer; font-family: monospace; font-size: 13px;
      }
      .feed-row.active { border-color: #e10600; background: #241012; }
      #stats {
        position: absolute; top: 12px; left: 12px; background: rgba(0,0,0,0.6);
        padding: 8px 12px; border-radius: 6px; font-family: monospace; font-size: 14px;
        pointer-events: none;
      }

      #toast {
        position: absolute; top: 48px; left: 50%; transform: translate(-50%, -12px); opacity: 0; pointer-events: none;
        padding: 14px 26px; border-radius: 14px; background: rgba(22,22,26,0.92); border: 1px solid #2a2a30;
        font-family: "Barlow", "Segoe UI", sans-serif; font-weight: 600; font-size: 26px; white-space: nowrap;
        transition: opacity 0.25s ease, transform 0.25s ease;
      }
      #toast.show { opacity: 1; transform: translate(-50%, 0); }

      /* Why nothing is playing, with the way out (js/errors.js words it). */
      #failure {
        position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 20;
        width: 900px; box-sizing: border-box; padding: 40px 48px; border-radius: 18px;
        background: rgba(22,22,26,0.96); border: 1px solid #2a2a30;
        font-family: "Barlow", "Segoe UI", sans-serif;
      }
      #failure[hidden] { display: none; }
      #failure h2 { margin: 0 0 14px; font-size: 40px; font-weight: 700; color: #f2f2f2; }
      #failure p { margin: 0; font-size: 26px; line-height: 1.45; color: #c8c8cc; }
      #failure .actions { margin-top: 30px; display: flex; gap: 18px; }
      #failure a {
        padding: 14px 30px; border-radius: 999px; font-size: 24px; font-weight: 600; text-decoration: none;
        background: #2a2a30; color: #f2f2f2;
      }
      #failure a:focus { background: #f2f2f2; color: #0b0b0d; outline: none; }

      /* ---- player controls: two rows, TV style ----
         Same type and colors as Browse. The bar's gradient area lets
         pointer events through (the rows take them back), so it never
         blocks the timing tower's scroll wheel. */
      #controls {
        position: absolute; left: 0; right: 0; bottom: 0;
        display: flex; flex-direction: column; gap: 14px;
        padding: 140px 64px 36px; box-sizing: border-box; pointer-events: none;
        background: linear-gradient(to top, rgba(0,0,0,0.92) 0%, rgba(0,0,0,0.62) 45%, rgba(0,0,0,0) 100%);
        font-family: "Barlow Condensed", "Arial Narrow", sans-serif; color: #f2f2f2;
        transition: opacity 0.3s ease, transform 0.3s ease;
      }
      /* Auto-hidden during playback after a few seconds without input (see
         showControls() in watch.js). */
      #controls.controls-hidden { opacity: 0; transform: translateY(28px); }
      #controls.controls-hidden #seek-row, #controls.controls-hidden #button-row { pointer-events: none; }

      #seek-row { display: flex; align-items: center; gap: 26px; pointer-events: auto; }
      .time { font-weight: 600; font-size: 28px; min-width: 104px; font-variant-numeric: tabular-nums; }
      #time-total { text-align: right; color: #9b9ba4; }
      #seek { position: relative; flex: 1; height: 40px; display: flex; align-items: center; cursor: pointer; outline: none; }
      #seek-track {
        position: relative; width: 100%; height: 6px; border-radius: 5px; overflow: hidden;
        background: rgba(255,255,255,0.22); transition: height 0.18s ease;
      }
      #seek-buffered { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: rgba(255,255,255,0.3); }
      #seek-played { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: #e10600; }
      #seek-thumb {
        position: absolute; top: 50%; left: 0; width: 20px; height: 20px; margin: -10px 0 0 -10px; border-radius: 50%;
        background: #f2f2f2; transform: scale(0.7); transition: transform 0.18s ease, box-shadow 0.18s ease;
      }
      #seek:focus #seek-track, #seek:hover #seek-track, #seek.scrubbing #seek-track { height: 10px; }
      #seek:focus #seek-thumb, #seek:hover #seek-thumb, #seek.scrubbing #seek-thumb {
        transform: scale(1.3); box-shadow: 0 0 0 7px rgba(225,6,0,0.4);
      }
      /* Target time above the thumb while stepping or dragging. */
      #seek-bubble {
        position: absolute; bottom: 40px; left: 0; transform: translate(-50%, 6px); padding: 4px 12px; border-radius: 8px;
        background: #f2f2f2; color: #0b0b0d; font-weight: 700; font-size: 26px; white-space: nowrap;
        font-variant-numeric: tabular-nums; opacity: 0; pointer-events: none;
        transition: opacity 0.15s ease, transform 0.15s ease;
      }
      #seek.scrubbing #seek-bubble { opacity: 1; transform: translate(-50%, 0); }

      #button-row { display: flex; align-items: center; justify-content: space-between; pointer-events: auto; }
      #button-row .group { display: flex; align-items: center; gap: 12px; }
      #controls button.ctrl {
        position: relative; width: 64px; height: 64px; border-radius: 32px; border: none; margin: 0; padding: 0;
        background: transparent; color: #f2f2f2; cursor: pointer;
        display: flex; align-items: center; justify-content: center;
        transition: background-color 0.18s ease, color 0.18s ease;
      }
      #controls button.ctrl.toggled { color: #e10600; }
      #controls button.ctrl:hover, #controls button.ctrl:focus { background: #f2f2f2; color: #0b0b0d; outline: none; }
      #controls button.ctrl .icon { width: 34px; height: 34px; transition: transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1); }
      /* An overlay that's on (timing tower, track map) gets a red dot. */
      #controls button.ctrl::after {
        content: ""; position: absolute; left: 50%; bottom: 5px; width: 6px; height: 6px; margin-left: -3px;
        border-radius: 3px; background: #e10600; transform: scale(0); transition: transform 0.22s cubic-bezier(0.2, 0.8, 0.2, 1.4);
      }
      #controls button.ctrl.toggled::after { transform: scale(1); }
      /* Press feedback, from the remote's OK as well as a click. */
      #controls button.ctrl.pressed { animation: press 0.24s ease-out; }
      @keyframes press { 40% { transform: scale(0.86); } 100% { transform: scale(1); } }
      /* Swapped icons (play/pause, mute) pop in. */
      #controls .icon.pop { animation: pop 0.3s cubic-bezier(0.2, 0.8, 0.2, 1.3); }
      @keyframes pop { from { transform: scale(0.55); opacity: 0.2; } to { transform: scale(1); opacity: 1; } }
      /* The gear turns while settings is open, and back when it closes. */
      #settings-btn.open .icon { transform: rotate(90deg); }
      #camera-btn.open .icon { transform: scale(1.12); }

      /* Rounded track with the level as a white fill; --fill is set from
         the volume and mute state in watch.js. */
      #volume {
        --fill: 100%;
        width: 130px; height: 28px; margin: 0 10px; padding: 0; background: transparent; cursor: pointer;
        -webkit-appearance: none; appearance: none;
      }
      #volume:focus { outline: none; }
      #volume::-webkit-slider-runnable-track {
        height: 6px; border-radius: 3px;
        background: linear-gradient(90deg, #f2f2f2 0%, #f2f2f2 var(--fill), rgba(255,255,255,0.26) var(--fill), rgba(255,255,255,0.26) 100%);
      }
      #volume::-webkit-slider-thumb {
        -webkit-appearance: none; width: 18px; height: 18px; margin-top: -6px; border-radius: 50%;
        background: #f2f2f2; transition: transform 0.15s ease;
      }
      #volume:hover::-webkit-slider-thumb { transform: scale(1.2); }

      /* Settings that sit in the bar when there's room (captions, quality,
         speed) - watch.js fitBarButtons() folds them back into the
         settings menu when there isn't. */
      [hidden] { display: none !important; }
      #controls button.ctrl.text-ctrl { width: auto; min-width: 64px; padding: 0 14px; box-sizing: border-box; }
      .text-ctrl .label {
        font-family: "Barlow Condensed", "Arial Narrow", sans-serif; font-weight: 700; font-size: 24px;
        letter-spacing: 0.02em; white-space: nowrap; font-variant-numeric: tabular-nums;
      }
      .text-ctrl .label.pop { animation: pop 0.3s cubic-bezier(0.2, 0.8, 0.2, 1.3); }
      #controls button.ctrl.unavailable { opacity: 0.4; }

      /* ---- menus (cameras, settings) ---- */
      .menu-wrap { position: relative; }
      .menu {
        position: absolute; bottom: 84px; right: 0; width: 420px; box-sizing: border-box;
        background: rgba(22,22,26,0.97); border: 1px solid #2a2a30; border-radius: 16px; padding: 10px;
        box-shadow: 0 16px 40px rgba(0,0,0,0.55); font-family: "Barlow", "Segoe UI", sans-serif;
        opacity: 0; visibility: hidden; transform: translateY(12px) scale(0.97); transform-origin: bottom right;
        transition: opacity 0.2s ease, transform 0.24s cubic-bezier(0.2, 0.8, 0.2, 1), visibility 0s linear 0.24s;
      }
      .menu.open { opacity: 1; visibility: visible; transform: none; transition-delay: 0s; }
      #camera-panel { max-height: 640px; overflow-y: auto; }
      #camera-panel::-webkit-scrollbar { display: none; }
      .menu-title {
        padding: 10px 20px 8px; font-family: "Barlow Condensed", "Arial Narrow", sans-serif; font-weight: 700; font-size: 20px;
        letter-spacing: 0.1em; text-transform: uppercase; color: #6c6c75;
      }
      .settings-row {
        display: flex; justify-content: space-between; align-items: center; gap: 16px;
        padding: 15px 20px; border-radius: 10px; cursor: pointer; outline: none;
        font-size: 24px; font-weight: 500; transition: background-color 0.15s ease, color 0.15s ease;
      }
      .settings-row:hover, .settings-row:focus { background: #f2f2f2; color: #0b0b0d; }
      .settings-row .value { color: #9b9ba4; font-size: 22px; font-family: "Barlow Condensed", "Arial Narrow", sans-serif; font-weight: 600; }
      .settings-row:hover .value, .settings-row:focus .value { color: #55555e; }
      /* Settings rows that open a list get a chevron. */
      /* Settings rows: icon, name, then the current value and - for rows
         that open a list - a chevron. */
      .settings-row { justify-content: flex-start; gap: 18px; }
      .settings-row .row-icon { flex: none; width: 30px; height: 30px; }
      .settings-row .row-icon svg { width: 30px; height: 30px; fill: currentColor; display: block; }
      .settings-row .row-name { flex: 1; min-width: 0; }
      .settings-row .value { display: flex; align-items: center; gap: 8px; white-space: nowrap; }
      .settings-row .value-hint { color: #6c6c75; }
      .settings-row:hover .value-hint, .settings-row:focus .value-hint { color: #75757e; }
      .settings-row.drill .value::after {
        content: ""; width: 9px; height: 9px; margin: 0 4px 0 6px;
        border-right: 3px solid currentColor; border-bottom: 3px solid currentColor; transform: rotate(-45deg);
      }

      /* Choice lists: a header (close, or back to Settings), then the
         options with a check on the current one. */
      #button-row { position: relative; }
      #choice-panel { width: 380px; transform-origin: bottom right; }
      .choice-head, .choice-row {
        display: flex; align-items: center; gap: 16px; padding: 14px 20px; border-radius: 10px;
        font-size: 24px; cursor: pointer; outline: none; transition: background-color 0.15s ease, color 0.15s ease;
      }
      .choice-head { font-weight: 600; }
      .choice-row { font-weight: 500; }
      .choice-head svg, .choice-row .check svg { width: 26px; height: 26px; fill: currentColor; display: block; }
      .choice-row .check { width: 26px; height: 26px; flex: none; visibility: hidden; }
      .choice-row.selected .check { visibility: visible; }
      .choice-row .hint {
        margin-left: auto; color: #9b9ba4; font-family: "Barlow Condensed", "Arial Narrow", sans-serif; font-weight: 600; font-size: 22px;
      }
      .choice-sep { height: 1px; background: #2a2a30; margin: 4px 12px 6px; }
      .choice-head:hover, .choice-head:focus, .choice-row:hover, .choice-row:focus { background: #f2f2f2; color: #0b0b0d; }
      .choice-row:hover .hint, .choice-row:focus .hint { color: #55555e; }
      .choice-row.disabled, .choice-row.disabled:hover { cursor: default; background: none; color: #6c6c75; font-size: 22px; }
      /* Camera picker: grouped like the choice lists - main feeds, then one
         group per team with a team-colour mark - with a check on the feed
         that's playing. Rows reuse .choice-row. */
      #camera-panel { width: 470px; max-height: 720px; }
      .camera-group {
        display: flex; align-items: center; gap: 16px; padding: 16px 20px 6px;
        font-family: "Barlow Condensed", "Arial Narrow", sans-serif; font-weight: 700; font-size: 20px;
        letter-spacing: 0.08em; text-transform: uppercase; color: #9b9ba4;
      }
      .camera-group:not(:first-child) { margin-top: 8px; border-top: 1px solid #2a2a30; padding-top: 18px; }
      .camera-group .team-mark { width: 26px; height: 6px; border-radius: 3px; flex: none; }
      .camera-row .code {
        font-family: "Barlow Condensed", "Arial Narrow", sans-serif; font-weight: 700; font-size: 24px;
        letter-spacing: 0.03em; min-width: 46px;
      }
      .camera-row .code:empty { display: none; }

      /* Line-art icons (Material style) rather than emoji, which render as
         inconsistent, colourful glyphs across browsers and TVs. */
      .icon { width: 34px; height: 34px; fill: currentColor; display: block; }
      #left-header a .icon { width: 20px; height: 20px; }

      @media (prefers-reduced-motion: reduce) {
        #controls, #controls *, .menu { transition: none !important; animation: none !important; }
      }

      /* Telemetry overlays - on demand, positioned so they don't sit over
         the middle of the picture. Track map: transparent corner box per
         the request that it not obstruct the feed. Timing tower: enough
         background to stay readable over bright video, docked to a side
         rather than transparent since it's mostly text. */
      #track-map-overlay {
        position: absolute; right: 20px; bottom: 190px; width: 340px; height: 340px;
        display: none; pointer-events: none;
      }
      #track-map-overlay.visible { display: block; }
      #track-map-overlay svg { width: 100%; height: 100%; }
      #track-map-placeholder {
        position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
        text-align: center; font-size: 12px; opacity: 0.6; padding: 20px; box-sizing: border-box;
      }

      /* 2x the original size and footprint, and actually scrollable/
         interactive now (pointer-events default, not none) so the Magic
         Remote's scroll wheel works while hovering it - it used to be a
         click-through HUD, which also meant it could never be scrolled. */
      #timing-tower-overlay {
        position: absolute; left: 20px; top: 20px; width: 920px; max-height: 92%;
        background: rgba(10,10,12,0.92); border-radius: 14px; overflow-y: auto;
        display: none; font-size: 22px; padding: 4px 0;
        /* Shrinks toward its top-left corner while the control bar shows
           (fitTowerAboveControls in watch.js), in step with the bar. */
        transform-origin: 0 0; transition: transform 0.3s ease;
      }
      #timing-tower-overlay.visible { display: block; }
      #timing-tower-rows { column-count: 2; column-gap: 4px; }
      .tt-row {
        padding: 8px 16px;
        border-bottom: 1px solid rgba(255,255,255,0.06);
        break-inside: avoid; -webkit-column-break-inside: avoid;
      }
      .tt-line1 { display: flex; align-items: center; gap: 12px; }
      .tt-line2 { display: flex; align-items: center; gap: 10px; margin-top: 6px; padding-left: 44px; }
      .tt-pos { width: 30px; text-align: right; opacity: 0.6; font-family: "Barlow Condensed", "Arial Narrow", sans-serif; font-variant-numeric: tabular-nums; }
      .tt-swatch { width: 6px; height: 26px; border-radius: 3px; flex: none; }
      .tt-tla { width: 62px; font-weight: bold; font-family: "Barlow Condensed", "Arial Narrow", sans-serif; font-variant-numeric: tabular-nums; }
      .tt-gap { flex: none; width: 90px; text-align: right; font-family: "Barlow Condensed", "Arial Narrow", sans-serif; font-variant-numeric: tabular-nums; opacity: 0.85; font-size: 0.8em; }
      .tt-lastlap { flex: 1; text-align: right; font-family: "Barlow Condensed", "Arial Narrow", sans-serif; font-variant-numeric: tabular-nums; opacity: 0.85; font-size: 0.85em; }
      .tt-lastlap.tt-green { color: #3ddc84; opacity: 1; }
      .tt-lastlap.tt-purple { color: #c159f0; opacity: 1; }
      .tt-tyre {
        flex: none; width: 34px; height: 34px; border-radius: 50%;
        display: flex; align-items: center; justify-content: center;
        font-size: 16px; font-weight: bold; font-family: "Barlow Condensed", "Arial Narrow", sans-serif; font-variant-numeric: tabular-nums;
      }
      .tt-tyre sub { font-size: 12px; margin-left: 1px; bottom: -2px; }
      .tt-sectors { display: flex; align-items: flex-end; flex: 1; gap: 14px; }
      .tt-sector { display: flex; flex-direction: column; gap: 3px; align-items: flex-start; }
      .tt-sector-ticks { display: flex; gap: 1px; }
      .tt-sector-ticks i { display: block; width: 5px; height: 11px; border-radius: 1px; background: #333; }
      .tt-sector-val { font-family: "Barlow Condensed", "Arial Narrow", sans-serif; font-variant-numeric: tabular-nums; font-size: 0.7em; opacity: 0.85; }
      .tt-sector-val.tt-green { color: #3ddc84; opacity: 1; }
      .tt-sector-val.tt-purple { color: #c159f0; opacity: 1; }
      .tt-seg-none { background: #333 !important; }
      .tt-seg-yellow { background: #ffcc00 !important; }
      .tt-seg-green { background: #3ddc84 !important; }
      .tt-seg-purple { background: #c159f0 !important; }
      .tt-seg-pit { background: #4aa3ff !important; }
      .tt-telem { flex: none; font-family: "Barlow Condensed", "Arial Narrow", sans-serif; font-variant-numeric: tabular-nums; font-size: 0.65em; opacity: 0.6; white-space: nowrap; margin-left: auto; }

      #timing-tower-placeholder { padding: 14px; opacity: 0.6; font-size: 12px; }
    </style>
  </head>
  <body data-back="browse.html">
    <div id="wrap">
      <div id="left" class="hidden-panel">
        <div id="left-header">
          <a href="browse.html" title="Back to Browse">
            <svg class="icon" viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
          </a>
          <span class="brand">Lights Out</span>
        </div>
        <h1>Manual load (debug)</h1>
        <label>contentId</label>
        <input id="content-id" placeholder="1000010563" />
        <label>platform (optional override)</label>
        <input id="platform" placeholder="BIG_SCREEN_HLS" />
        <button id="load-btn">Load PLAY + feeds</button>
        <div id="status">not loaded</div>
        <div id="feeds"></div>
      </div>
      <div id="right">
        <video id="video"></video>
        <div id="stats" style="display:none"></div>
        <div id="toast" role="status"></div>
        <div id="failure" role="alert" hidden>
          <h2 id="failure-title"></h2>
          <p id="failure-text"></p>
          <div class="actions">
            <a id="failure-camera" href="#" hidden>Choose another camera</a>
            <a id="failure-signin" href="setup.html" hidden>Sign in</a>
            <a id="failure-back" href="browse.html">Back to Browse</a>
          </div>
        </div>

        <div id="timing-tower-overlay">
          <div id="timing-tower-placeholder">Waiting for timing data&hellip;</div>
          <div id="timing-tower-rows"></div>
        </div>
        <div id="track-map-overlay">
          <div id="track-map-placeholder">Waiting for position data&hellip;</div>
          <svg id="track-map-svg" viewBox="0 0 100 100"></svg>
        </div>

        <!-- Two rows, TV style: a full-width seek bar, then the buttons.
             Up/Down moves between the rows; Left/Right seeks on the bar
             and moves between buttons on the button row (watch.js). -->
        <div id="controls">
          <div id="seek-row">
            <div id="time-current" class="time">0:00</div>
            <div id="seek" tabindex="0" role="slider" aria-label="Seek" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
              <div id="seek-track"><div id="seek-buffered"></div><div id="seek-played"></div></div>
              <div id="seek-thumb"></div>
